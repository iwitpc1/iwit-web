<section class="useful-features-section">
  <div class="useful-features-container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-badge">Useful Features</span>
      <h2 class="section-title">
        <span class="highlight">
          <span class="highlighted-img">
            <img src="assets/shape.svg" alt="highlighted image" />
          </span>
          Everything you need</span
        >
        to start your next project
      </h2>
      <p class="section-description">
        Not just a set of tools, the package includes ready-to-deploy conceptual application.
      </p>
    </div>

    <!-- Features Grid -->
    <div class="features-grid">
      @for (feature of features; track feature.id) {
        <div class="feature-item">
          <div class="feature-icon">
            <img src="{{ feature.iconUrl }}" alt="{{ feature.title }} icon" />
          </div>
          <h3 class="feature-title">{{ feature.title }}</h3>
          <p class="feature-description">{{ feature.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
