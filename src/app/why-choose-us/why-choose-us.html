<section class="why-choose-us-section">
  <div class="why-choose-us-container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-badge">Why Choose us</span>
      <h2 class="section-title">
        <span class="highlight">
          <span class="highlighted-img">
            <img src="assets/shape.svg" alt="highlighted image" />
          </span>
          Everything you need</span
        >
        to choose the right partner
      </h2>
      <p class="section-description">
        We focus on quality, clarity, and outcomes that actually matter.
      </p>
    </div>
    <!-- Features Grid -->
    <div class="features-grid">
      @for (feature of features; track feature.id) {
        <div class="feature-card">
          <div class="feature-icon">
            <img [src]="feature.iconSrc" [alt]="feature.icon + ' icon'" />
          </div>
          <div>
            <h3 class="feature-title">{{ feature.title }}</h3>
            <p class="feature-description">{{ feature.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
