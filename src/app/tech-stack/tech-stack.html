<section class="tech-stack-section">
  <div class="tech-stack-container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-badge">Tech Stack</span>
      <h2 class="section-title">
        <span class="highlight">
          <span class="highlighted-img">
            <img src="assets/shape.svg" alt="highlighted image" />
          </span>
          Powered by</span
        >
        modern and reliable technologies
      </h2>
      <p class="section-description">
        We use tools and frameworks that ensure performance, security, and scalability.
      </p>
    </div>

    <!-- Tech Logos -->
    <div class="tech-logos">
      <!-- Angular -->
      @for (techIcon of techIcons; track techIcon.name) {
        <div [class]="'tech-logo ' + techIcon.id">
          <img src="{{ techIcon.logoSrc }}" alt="{{ techIcon.name }} logo" />
        </div>
      }
    </div>

    <!-- Features Grid -->
    <div class="features-grid">
      @for (feature of features; track feature.id) {
        <div class="feature-card">
          <div class="feature-icon">
            <img src="{{ feature.iconUrl }}" alt="{{ feature.title }} icon" />
          </div>
          <h3 class="feature-title">{{ feature.title }}</h3>
          <p class="feature-description">{{ feature.description }}</p>
          <button class="read-more-btn">Read More</button>
        </div>
      }
    </div>
  </div>
</section>
