<section class="products-section" id="products">
  <div class="products-container">
    <!-- Section Header -->
    <div class="section-header">
      <span class="section-badge">Our Products</span>
      <h2 class="section-title">
        <span class="highlight">
          <span class="highlighted-img">
            <img src="assets/shape.svg" alt="highlighted image" />
          </span>
          Ready built solutions</span
        >
        designed to save time and effort.
      </h2>
      <p class="section-description">
        Our products are created to be reliable, scalable, and easy to use.
      </p>
    </div>

    <!-- Carousel -->
    <div class="carousel-wrapper">
      <div class="carousel-track" [style.transform]="'translateX(-' + currentSlide() * 100 + '%)'">
        @for (product of products; track product.id; let i = $index) {
          <div class="carousel-slide" [class.active]="i === currentSlide()">
            <div class="product-card" [class.center]="i === currentSlide()">
              @if (i === currentSlide()) {
                <!-- Center Card - Featured Product -->
                <img [src]="product.image" alt="product image" />

                <!-- <div class="product-card-content featured">
                  <div class="product-image-container">
                    <div class="laptop-mockup">
                      <div class="laptop-screen">
                        <div class="kasebook-interface">
                          <div class="interface-sidebar">
                            <div class="sidebar-item active"></div>
                            <div class="sidebar-item"></div>
                            <div class="sidebar-item"></div>
                            <div class="sidebar-item"></div>
                          </div>
                          <div class="interface-main">
                            <div class="interface-header"></div>
                            <div class="interface-cards">
                              <div class="interface-card"></div>
                              <div class="interface-card"></div>
                              <div class="interface-card"></div>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div class="laptop-base"></div>
                    </div>
                  </div>
                  <p class="product-description">{{ product.description }}</p>
                </div> -->
              } @else {
                <!-- Side Cards - Decorative -->
                <div class="product-card-content side">
                  @if (i === 0) {
                    <!-- Left Card - Analytics -->
                    <div class="decorative-card analytics">
                      <div class="chart-element pie">
                        <svg width="120" height="120" viewBox="0 0 120 120">
                          <circle cx="60" cy="60" r="50" fill="#E9D5FF" />
                          <path d="M60 60 L60 10 A50 50 0 0 1 95 85 Z" fill="#A855F7" />
                          <path d="M60 60 L95 85 A50 50 0 0 1 25 85 Z" fill="#EC4899" />
                          <path d="M60 60 L25 85 A50 50 0 0 1 60 10 Z" fill="#FBBF24" />
                        </svg>
                      </div>
                      <div class="chart-element line">
                        <svg width="140" height="80" viewBox="0 0 140 80">
                          <rect x="10" y="10" width="120" height="60" fill="#F3E8FF" rx="8" />
                          <path
                            d="M20 50 L40 30 L60 40 L80 20 L100 35 L120 15"
                            stroke="#8B5CF6"
                            stroke-width="3"
                            fill="none"
                          />
                          <circle cx="20" cy="50" r="4" fill="#8B5CF6" />
                          <circle cx="40" cy="30" r="4" fill="#8B5CF6" />
                          <circle cx="60" cy="40" r="4" fill="#8B5CF6" />
                        </svg>
                      </div>
                      <div class="chart-element bars">
                        <div class="bar" style="height: 40%; background: #fbbf24"></div>
                        <div class="bar" style="height: 60%; background: #8b5cf6"></div>
                        <div class="bar" style="height: 35%; background: #ec4899"></div>
                        <div class="bar" style="height: 50%; background: #3b82f6"></div>
                      </div>
                    </div>
                  } @else {
                    <!-- Right Card - Design -->
                    <div class="decorative-card design">
                      <div class="design-element bottle">
                        <svg width="100" height="140" viewBox="0 0 100 140">
                          <defs>
                            <linearGradient id="bottleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                              <stop offset="0%" stop-color="#A855F7" />
                              <stop offset="100%" stop-color="#EC4899" />
                            </linearGradient>
                          </defs>
                          <path
                            d="M30 20 L30 40 Q30 50 40 60 L40 120 Q40 130 50 130 Q60 130 60 120 L60 60 Q70 50 70 40 L70 20 Z"
                            fill="url(#bottleGradient)"
                          />
                          <rect x="25" y="10" width="50" height="15" fill="#8B5CF6" rx="3" />
                        </svg>
                      </div>
                      <div class="design-element ruler">
                        <svg width="80" height="100" viewBox="0 0 80 100">
                          <rect x="10" y="10" width="60" height="80" fill="#FBBF24" rx="4" />
                          <rect x="15" y="15" width="10" height="3" fill="#FFF" />
                          <rect x="15" y="25" width="10" height="3" fill="#FFF" />
                          <rect x="15" y="35" width="10" height="3" fill="#FFF" />
                        </svg>
                      </div>
                      <div class="design-text">
                        <div class="text-badge">WEB</div>
                        <div class="text-badge">DESIGN</div>
                      </div>
                    </div>
                  }
                </div>
              }
            </div>
          </div>
        }
      </div>

      <!-- Navigation Arrows -->
      <button class="carousel-arrow left" (click)="prevSlide()" aria-label="Previous product">
        <img src="assets/arrow-left.svg" class="black-arrow" alt="Previous product" />
        <img src="assets/arrow-left-white.svg" class="white-arrow" alt="Previous product" />
      </button>
      <button class="carousel-arrow right" (click)="nextSlide()" aria-label="Next product">
        <img src="assets/arrow-right.svg" class="black-arrow" alt="Next product" />
        <img src="assets/arrow-right-white.svg" class="white-arrow" alt="Next product" />
      </button>
    </div>

    <!-- Carousel Indicators -->
    <!-- <div class="carousel-indicators">
      @for (product of products; track product.id; let i = $index) {
        <button
          class="indicator-dot"
          [class.active]="i === currentSlide()"
          (click)="goToSlide(i)"
          [attr.aria-label]="'Go to product ' + (i + 1)"
        ></button>
      }
    </div> -->
  </div>
</section>
